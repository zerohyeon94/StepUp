# SwiftLint Configuration for StepUp
# https://realm.github.io/SwiftLint/rule-directory.html

included:
  - StepUp

excluded:
  - StepUpTests
  - StepUpUITests
  - .build
  - DerivedData

# Disabled Rules
disabled_rules:
  - trailing_whitespace
  - line_length
  - todo

# Opt-in Rules
opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Rule Configuration
force_cast: error
force_try: error
force_unwrapping: warning

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - to

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level: 2
  function_level: 3

# Custom Rules
custom_rules:
  no_print_in_production:
    name: "No print() in production code"
    regex: "print\\("
    message: "print()를 사용하지 마세요. 디버깅에는 Logger를 사용하세요."
    severity: warning
    match_kinds:
      - identifier
